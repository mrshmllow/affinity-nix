# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: "Build"
on:
  pull_request:
  push:
jobs:
  pre-job:
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@4c5980e005e0ae8f7d9dff27ae88c605fe4c5ecc
        with:
          concurrent_skipping: "same_content_newer"
          cancel_others: "true"
  build-independent:
    needs: pre-job
    strategy:
      matrix:
        package: [apl-combined, runner-artifacts, wine]
        arch:
          - id: x86_64-linux
            runner: ubuntu-latest
            # has no aarch packages but if it ever got one uncomment this
            # - id: aarch64-linux
            #   runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: Mic92/niks3-action@v1.5.0
        with:
          server-url: https://niks3.forall.systems
          debug: 'true'
      - name: Build
        run: |
          nix build -L --print-out-paths \
            .#packages."${ARCH}"."${MATRIX_PACKAGE}"
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
          ARCH: ${{ matrix.arch.id }}
  build:
    needs: build-independent
    strategy:
      matrix:
        package: [base-prefix-pre-affinity]
        arch:
          - id: x86_64-linux
            runner: ubuntu-latest
            # has no aarch packages but if it ever got one uncomment this
            # - id: aarch64-linux
            #   runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: Mic92/niks3-action@v1.5.0
        with:
          server-url: https://niks3.forall.systems
          debug: 'true'
      - name: Build
        run: |
          nix build -L --print-out-paths \
            .#packages."${ARCH}"."${MATRIX_PACKAGE}"
        env:
          MATRIX_PACKAGE: ${{ matrix.package }}
          ARCH: ${{ matrix.arch.id }}
